name: CI

on:
  push:
    branches: [main, 'feature/**', 'release/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.80.0
          environments: default docs oracle frameworks
          locked: true
      - name: Build, runtime tests, ownership checks, and packaged consumer
        run: pixi run --locked check
      - name: Verify generated API reference
        run: pixi run --locked -e docs docs-check
      - name: Verify Treelite fixtures and interoperability
        run: |
          pixi run --locked -e oracle fixtures-check
          pixi run --locked -e oracle interop
      - name: Verify trained framework fixtures and interoperability
        run: |
          pixi run --locked -e frameworks framework-fixtures-check
          pixi run --locked -e frameworks framework-interop

  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.80.0
          environments: packaging
          locked: true
      - name: Build Conda package and test an isolated installation
        run: pixi run --locked -e packaging conda-build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: balsa-conda-linux-64
          path: build/conda/linux-64/*.conda
          if-no-files-found: error
