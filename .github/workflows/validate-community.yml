name: Validate community recipe

# Builds recipes/balsa from a modular-community fork the way upstream CI does
# (rattler-build 0.30.x, upstream variants, channel order and --skip-existing
# off so the build always runs), then installs the result into a clean
# workspace. Nothing is published.
on:
  workflow_dispatch:
    inputs:
      community-repository:
        description: modular-community fork that holds the recipe
        default: Str-Gen/modular-community
        required: true
      community-ref:
        description: Full commit SHA of the recipe in that fork
        required: true

permissions:
  contents: read

jobs:
  recipe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ inputs.community-repository }}
          ref: ${{ inputs.community-ref }}
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.80.0
          run-install: false
      - name: Build exact recipe with upstream rattler-build, variants and channel order
        run: |
          pixi exec --spec "rattler-build>=0.30.0,<0.31" -- rattler-build build \
            --channel conda-forge \
            --channel https://conda.modular.com/max \
            --channel https://prefix.dev/modular-community \
            --variant-config variants/variants.yaml \
            --output-dir output \
            --recipe recipes/balsa/recipe.yaml
      - name: Install from local output and declared channels in a clean workspace
        shell: bash
        run: |
          set -euo pipefail
          version="$(grep -E '^  version: "' recipes/balsa/recipe.yaml | cut -d'"' -f2)"
          install_dir=$(mktemp -d)
          cat > "$install_dir/pixi.toml" <<TOML
          [workspace]
          name = "balsa-installed-consumer"
          channels = ["file://$PWD/output", "conda-forge", "https://conda.modular.com/max", "https://prefix.dev/modular-community"]
          channel-priority = "strict"
          platforms = ["linux-64"]
          [dependencies]
          balsa = "==$version"
          gcc_linux-64 = "*"
          TOML
          cp recipes/balsa/test.mojo "$install_dir/test.mojo"
          cd "$install_dir"
          pixi install
          pixi list
          pixi run mojo --version
          pixi run mojo run test.mojo
          cp pixi.lock "$GITHUB_WORKSPACE/output/isolated-consumer.lock"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: community-recipe-linux-64
          path: output
